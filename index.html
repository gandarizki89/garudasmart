<!DOCTYPE html>
<html lang="id"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GarudaSmart</title>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="config.js"></script>
<script src="ai-lokal.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f6;--sf:#fff;--ink:#12292e;--mu:#5d7378;--ln:#d9e3e4;--br:#0f5c6e;--bi:#fff;--ac:#f2b134;--ai:#3b2a00;--ok:#1f7a4d;--wa:#b4691a;--bd:#b3392f;--so:#e4f0f1}
@media(prefers-color-scheme:dark){:root{--bg:#0d1b1e;--sf:#142629;--ink:#e6f1f2;--mu:#9bb2b6;--ln:#26403f;--br:#4fb3c8;--bi:#062329;--ok:#5fcf97;--wa:#f0a95c;--bd:#f0877d;--so:#1b3438}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{background:var(--br);color:var(--bi);border:0;border-radius:10px;padding:.7rem 1.1rem;font-weight:600}.btn.alt{background:var(--so);color:var(--ink)}.btn.sm{padding:.4rem .7rem;font-size:.9rem}.btn:disabled{opacity:.6}
input,select,textarea{width:100%;background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:.65rem .8rem}
label{display:block;font-weight:600;font-size:.9rem;margin:.9rem 0 .3rem}
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{background:var(--br);color:var(--bi);padding:clamp(1.5rem,5vw,4rem);display:flex;flex-direction:column;justify-content:space-between;gap:2rem}
.hero h1{font-size:clamp(2.2rem,5.5vw,4.2rem);font-weight:800;letter-spacing:-.02em;max-width:12ch}.hero p{max-width:40ch;opacity:.9}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:.5rem}.logo i{width:1.5rem;height:1.5rem;border-radius:6px;background:var(--ac)}
.panel{display:flex;align-items:center;justify-content:center;padding:1.5rem}.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:1.2rem}.box{width:100%;max-width:420px}
.tabs{display:flex;gap:.35rem;background:var(--so);padding:.3rem;border-radius:12px;margin:1rem 0}.tabs button{flex:1;border:0;background:transparent;padding:.55rem .3rem;border-radius:9px;font-weight:600;color:var(--mu)}.tabs button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hint{font-size:.85rem;color:var(--mu);margin:.8rem 0 0}.err{color:var(--bd);font-size:.9rem;min-height:1.3em;margin-top:.5rem}.err.ok{color:var(--ok)}
.lnk{background:none;border:0;padding:0;color:var(--br);font-weight:600;text-decoration:underline}
.top{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem clamp(1rem,4vw,2rem)}
.who{display:flex;align-items:center;gap:.7rem;font-size:.92rem;text-align:right}.who small{color:var(--mu);display:block}
.nav{display:flex;gap:.3rem;overflow-x:auto;padding:.6rem clamp(1rem,4vw,2rem);background:var(--sf);border-bottom:1px solid var(--ln)}.nav button{border:0;background:transparent;padding:.5rem .9rem;border-radius:99px;font-weight:600;color:var(--mu);white-space:nowrap}.nav button[aria-current=page]{background:var(--br);color:var(--bi)}
main{max-width:1000px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,2rem) 3rem}main h2{font-size:1.7rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1rem}.stat b{font-family:"Bricolage Grotesque",sans-serif;font-size:2.2rem;display:block;line-height:1}.stat span{color:var(--mu);font-size:.9rem}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:.6rem .5rem;border-bottom:1px solid var(--ln)}th{font-size:.85rem;color:var(--mu)}td input{width:4.2rem;padding:.35rem .5rem}
.bar{margin:.7rem 0}.bar div:first-child{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:.25rem}.track{height:12px;background:var(--so);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--br);border-radius:99px}
.pill{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--so)}.pill.ok{color:var(--ok)}.pill.warn{color:var(--wa)}.pill.bad{color:var(--bd)}
.seg{display:inline-flex;gap:.25rem}.seg button{border:1.5px solid var(--ln);background:var(--sf);border-radius:8px;padding:.3rem .6rem;font-weight:600}.seg button[aria-pressed=true]{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.item{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--ln)}.item:last-child{border:0}.item small{color:var(--mu);display:block}.done .t{text-decoration:line-through;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.empty{color:var(--mu);padding:.8rem 0}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
a.btn{text-decoration:none;display:inline-block}.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.6rem}
.pre{white-space:pre-wrap;font-size:.95rem;margin-top:.5rem}.mc{padding:.9rem 0;border-bottom:1px solid var(--ln)}.mc:last-child{border:0}.mc summary{cursor:pointer;font-weight:600;color:var(--br)}
.vid{position:relative;padding-top:56.25%;margin:.6rem 0}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
.tile{text-align:left;cursor:pointer;color:var(--ink)}.tile b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}.tile span{color:var(--mu);font-size:.9rem}
.kode{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;font-weight:800;letter-spacing:.12em;background:var(--so);padding:.3rem .8rem;border-radius:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}.md{width:100%;max-width:640px;max-height:90vh;overflow:auto}
.opt{display:block;width:100%;text-align:left;margin:.4rem 0}.opt.good{background:var(--ok);color:var(--bg)}.opt.bad{background:var(--bd);color:var(--bg)}
.chat{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem}.msg{background:var(--so);padding:.5rem .8rem;border-radius:12px;max-width:85%;align-self:flex-start}.msg.me{background:var(--br);color:var(--bi);align-self:flex-end}.msg small{display:block;opacity:.75;font-size:.75rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:.8rem}.cal>div{min-height:74px;border:1px solid var(--ln);border-radius:8px;padding:.25rem;font-size:.75rem;background:var(--sf);overflow:hidden}.cal>.h{min-height:0;border:0;background:none;text-align:center;font-weight:600;color:var(--mu)}.cal b{display:block}.cal i{display:block;font-style:normal;border-radius:4px;padding:0 .25rem;margin-top:2px;background:var(--so);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal>.today{border:2px solid var(--br)}
@media(max-width:760px){.login{grid-template-columns:1fr}.hero{min-height:36vh}.two{grid-template-columns:1fr}.who small{display:none}}
</style></head><body><div id="root"></div><div id="toast" role="status"></div>
<script>
const JENJANG=['SD / MI','SMP / MTs','SMA / SMK / MA','Perguruan tinggi'],MAPEL=['Matematika','B. Indonesia','IPA','B. Inggris'],QS=['Di kota mana Anda lahir?','Siapa nama hewan peliharaan pertama Anda?','Apa nama sekolah dasar Anda?'],LABEL={guru:'Guru',siswa:'Siswa',ortu:'Orang tua'};
const NAVS={guru:[['ringkasan','Dasbor'],['kelas','Kelas'],['materi','Materi & tugas'],['presensi','Presensi'],['siswa','Nilai & evaluasi'],['kalender','Kalender'],['chat','Chat kelas'],['pribadi','Chat pribadi'],['ai','Asisten AI'],['pengaturan','Pengaturan'],['akun','Akun']],siswa:[['beranda','Beranda'],['kelas','Kelas & materi'],['tugas','Tugas'],['presensi','Presensi'],['nilai','Nilai'],['kalender','Kalender'],['chat','Chat kelas'],['pribadi','Chat guru'],['eval','Evaluasi'],['akun','Akun']],ortu:[['beranda','Perkembangan anak'],['nilai','Nilai'],['tugas','Tugas anak'],['kalender','Kalender'],['chat','Chat kelas'],['pribadi','Chat guru'],['eval','Evaluasi'],['akun','Akun']]};
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={tok:null,d:null,view:'',reg:'siswa',fu:null};
/* ---- AI lokal (tanpa API): berjalan di browser ---- */
const kCtx=()=>{const d=S.d,c=d.cfg||{};return{sekolah:d.me.sekolah,kurikulum:c.kurikulum,konteks:c.konteks}};
const AIFN={
aiBuat:(tok,p)=>{const k=S.d.kelas.find(x=>x.id===p.kelasId)||{};return AILokal.buat({...kCtx(),jenis:p.jenis,topik:p.topik,jumlah:p.jumlah,sumber:p.sumber,kelas:k.nama,mapel:k.mapel})},
aiChat:(tok,pesan)=>AILokal.chat(pesan,kCtx()),
aiEvaluasi:(tok,sid)=>{const d=S.d,s=d.students.find(x=>x.id===sid);if(!s)throw new Error('Siswa tidak ditemukan.');const kid=Object.keys(d.anggota).filter(k=>d.anggota[k].some(a=>a.id===sid)),T=d.tugas.filter(t=>kid.includes(t.kelasId));return AILokal.evaluasi(s,T.length,T.filter(t=>t.selesai.includes(sid)).length)}
};
/* ---- panggilan ke backend: Apps Script langsung, atau via fetch (GitHub Pages) ---- */
const inGAS=()=>!!(window.google&&google.script&&google.script.run);
async function apiFetch(fn,a){
const url=String(window.GARUDA_API_URL||'').trim();
if(!url)throw new Error('Alamat backend belum diisi. Buka config.js dan isi GARUDA_API_URL dengan URL Web App Apps Script.');
let r;try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})})}catch(e){throw new Error('Tidak dapat terhubung ke server. Periksa GARUDA_API_URL di config.js dan koneksi internet.')}
let j;try{j=await r.json()}catch(e){throw new Error('Server tidak membalas dengan benar. Pastikan Web App di-deploy dengan akses "Anyone" dan URL berakhiran /exec.')}
if(!j.ok)throw new Error(j.error||'Terjadi kesalahan.');return j.data}
const call=(fn,...a)=>AIFN[fn]?Promise.resolve().then(()=>AIFN[fn](...a)):inGAS()?new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a)):apiFetch(fn,a);
const msg=e=>String(e&&e.message||e).replace(/^(Error|Exception):\s*/,'');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
async function run(btn,fn,onErr){const t=btn.textContent;btn.disabled=true;btn.textContent='Memproses…';try{await fn()}catch(e){onErr(msg(e))}finally{btn.disabled=false;btn.textContent=t}}
const avg=s=>Math.round(s.nilai.reduce((a,b)=>a+b,0)/4),tone=v=>v>=85?'ok':v>=70?'warn':'bad';
const tot=s=>s.att.H+s.att.S+s.att.I+s.att.A,pct=s=>tot(s)?Math.round(s.att.H/tot(s)*100)+'%':'–';
const fmt=d=>{const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('id-ID',{day:'numeric',month:'short'})};

function authView(mode='masuk',m='',ok=false){
const r=S.reg,err=`<div class="err ${ok?'ok':''}" id="err" role="alert">${m}</div>`;let h='';
if(mode==='masuk')h=`<h2>Masuk</h2><label for="u">Nama pengguna</label><input id="u" autocomplete="username"><label for="p">Kata sandi</label><input id="p" type="password" autocomplete="current-password">${err}<button class="btn" id="go" style="width:100%">Masuk</button><p class="hint"><button class="lnk" data-m="lupa">Lupa kata sandi?</button></p><p class="hint">Belum punya akun? <button class="lnk" data-m="daftar">Daftar sekarang</button></p>`;
if(mode==='daftar')h=`<h2>Daftar akun</h2><div class="tabs" role="group" aria-label="Daftar sebagai">${['guru','siswa','ortu'].map(k=>`<button data-r="${k}" aria-pressed="${k===r}">${LABEL[k]}</button>`).join('')}</div><label for="n">${r==='siswa'?'Nama lengkap siswa':'Nama lengkap Anda'}</label><input id="n" autocomplete="name">${r==='guru'?`<label for="k">Kode guru</label><input id="k" type="password">`:''}${r==='ortu'?`<label for="an">Nama lengkap anak</label><input id="an"><div class="hint">Isi persis seperti yang didaftarkan anak Anda.</div>`:''}<label for="jj">Jenjang</label><select id="jj">${JENJANG.map(x=>`<option>${x}</option>`).join('')}</select><label for="sk">Nama sekolah atau kampus</label><input id="sk" list="skl" autocomplete="off"><datalist id="skl"></datalist><div class="hint" id="skh">Ketik minimal 3 huruf untuk mencari. Jika belum ada, tulis namanya sendiri.</div><label for="u">Nama pengguna</label><input id="u" autocomplete="username"><label for="p">Kata sandi (minimal 6 karakter)</label><input id="p" type="password" autocomplete="new-password"><label for="p2">Ulangi kata sandi</label><input id="p2" type="password" autocomplete="new-password"><label for="q">Pertanyaan pemulihan</label><select id="q">${QS.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select><label for="a">Jawaban pemulihan</label><input id="a">${err}<button class="btn" id="reg" style="width:100%">Buat akun</button><p class="hint">Sudah punya akun? <button class="lnk" data-m="masuk">Masuk</button></p>`;
if(mode==='lupa')h=`<h2>Lupa kata sandi</h2>`+(S.fu?`<p class="hint">Akun <b>${esc(S.fu.u)}</b>. Jawab pertanyaan pemulihan Anda.</p><label for="a">${esc(S.fu.q)}</label><input id="a"><label for="p">Kata sandi baru</label><input id="p" type="password" autocomplete="new-password"><label for="p2">Ulangi kata sandi baru</label><input id="p2" type="password" autocomplete="new-password">${err}<button class="btn" id="rs" style="width:100%">Simpan kata sandi baru</button>`:`<p class="hint">Masukkan nama pengguna Anda untuk memulai pemulihan.</p><label for="u">Nama pengguna</label><input id="u">${err}<button class="btn" id="nx" style="width:100%">Lanjut</button>`)+`<p class="hint"><button class="lnk" data-m="masuk">Kembali ke halaman masuk</button></p>`;
$('#root').innerHTML=`<div class="login"><section class="hero"><div class="logo"><i></i>GarudaSmart</div><div><h1>Satu sekolah, tiga sudut pandang.</h1><p>Guru mengelola nilai dan absensi, siswa memantau tugas, orang tua mengikuti perkembangan anaknya.</p></div><div class="three"><span>Tema hari ini: ${S.theme}</span><span id="cnt" hidden></span></div></section><section class="panel"><div class="box card">${h}</div></section></div>`;
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.fu=null;authView(b.dataset.m)});
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.reg=b.dataset.r;authView('daftar')});
schoolHooks();const g=id=>($('#'+id)||{}).value||'',e=t=>{$('#err').textContent=t;$('#err').className='err'};
if(mode==='masuk'){const go=()=>run($('#go'),async()=>{const x=await call('login',g('u'),g('p'));S.tok=x.token;S.view=NAVS[x.me.role][0][0];await refresh()},e);$('#go').onclick=go;$('#p').onkeydown=ev=>{if(ev.key==='Enter')go()}}
if(mode==='daftar')$('#reg').onclick=()=>{if(g('p')!==g('p2'))return e('Kedua kata sandi belum sama.');run($('#reg'),async()=>{await call('register',{role:r,nama:g('n'),kode:g('k'),anak:g('an'),sekolah:g('sk'),jenjang:g('jj'),u:g('u'),pw:g('p'),q:g('q'),a:g('a')});authView('masuk','Akun berhasil dibuat. Silakan masuk.',true)},e)};
if(mode==='lupa'&&!S.fu)$('#nx').onclick=()=>run($('#nx'),async()=>{const u=g('u'),q=await call('recoveryQuestion',u);S.fu={u:u.trim().toLowerCase(),q};authView('lupa')},e);
if(mode==='lupa'&&S.fu)$('#rs').onclick=()=>{if(g('p')!==g('p2'))return e('Kedua kata sandi belum sama.');run($('#rs'),async()=>{await call('resetPassword',S.fu.u,g('a'),g('p'));S.fu=null;authView('masuk','Kata sandi diperbarui. Silakan masuk.',true)},e)};
}
async function refresh(){try{S.d=await call('getData',S.tok);S.d.aiAktif=true;if(!inGAS())S.d.appUrl=location.href.split('#')[0].split('?')[0];app()}catch(e){S.tok=null;authView('masuk',msg(e))}}
const bars=s=>MAPEL.map((m,i)=>`<div class="bar"><div><span>${m}</span><b>${s.nilai[i]}</b></div><div class="track"><div class="fill" style="width:${s.nilai[i]}%"></div></div></div>`).join('');
const news=()=>S.d.info.length?S.d.info.map(n=>`<div class="item"><div>${esc(n.teks)}<small>${fmt(n.tanggal)}</small></div></div>`).join(''):'<div class="empty">Belum ada pengumuman.</div>';
function app(){const {me}=S.d;
$('#root').innerHTML=`<header class="top"><div class="logo"><i></i>GarudaSmart</div><div class="who"><div><b>${esc(me.nama)}</b><small>${LABEL[me.role]}${me.sekolah?', '+esc(me.sekolah):''}</small></div><button class="btn alt sm" id="out">Keluar</button></div></header><nav class="nav" aria-label="Menu">${NAVS[me.role].map(n=>`<button data-v="${n[0]}" ${S.view===n[0]?'aria-current="page"':''}>${n[1]}</button>`).join('')}</nav><main id="main"></main>`;
$('#out').onclick=()=>{S.tok=null;S.d=null;authView()};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;app()});
stopPoll();dclose();(V[me.role+'_'+S.view]||V.kosong)();extra();if(me.role==='siswa'){banner();if(!BP)BP=setInterval(()=>{if(!S.tok||!S.d)return;call('presensiAktif',S.tok).then(r=>{if(r.map(x=>x.id).join()!==S.d.presensi.map(x=>x.id).join())refresh()}).catch(()=>{})},20000)}}
const act=async(fn,...a)=>{try{await call(fn,S.tok,...a);return true}catch(e){toast(msg(e));return false}};
const V={
siswa_beranda(){const s=S.d.students[0],pend=S.d.tugas.filter(t=>!t.selesai.includes(s.id));$('#main').innerHTML=`<h2>Halo, ${esc(s.nama.split(' ')[0])}</h2><div class="grid"><div class="card stat"><b>${avg(s)}</b><span>Rata-rata nilai</span></div><div class="card stat"><b>${pct(s)}</b><span>Kehadiran</span></div><div class="card stat"><b>${pend.length}</b><span>Tugas belum selesai</span></div></div><div class="two"><div class="card"><h3>Nilai saya</h3>${bars(s)}</div><div class="card"><h3>Pengumuman</h3>${news()}</div></div>`},
siswa_tugas(){const s=S.d.students[0];$('#main').innerHTML=`<h2>Tugas</h2><div class="card">${S.d.tugas.map(t=>{const d=t.selesai.includes(s.id);return`<div class="item ${d?'done':''}"><div class="t">${esc(t.judul)}<small>${esc(t.mapel)} · tenggat ${fmt(t.tenggat)}</small>${t.isi?`<details><summary>Lihat instruksi</summary><div class="pre">${esc(t.isi)}</div></details>`:''}</div><button class="btn ${d?'alt':''} sm" data-t="${t.id}">${d?'Batalkan':'Tandai selesai'}</button></div>`}).join('')||'<div class="empty">Belum ada tugas dari guru.</div>'}</div>`;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{if(await act('toggleTugas',b.dataset.t))await refresh()})},
ortu_beranda(){const s=S.d.students[0],a=s.att;$('#main').innerHTML=`<h2>Perkembangan ${esc(s.nama)}</h2><div class="grid"><div class="card stat"><b>${avg(s)}</b><span>Rata-rata nilai</span></div><div class="card stat"><b>${pct(s)}</b><span>Kehadiran</span></div><div class="card stat"><b>${S.d.tugas.filter(t=>!t.selesai.includes(s.id)).length}</b><span>Tugas belum selesai</span></div></div><div class="two"><div class="card"><h3>Nilai</h3>${bars(s)}</div><div class="card"><h3>Rincian kehadiran</h3>${[['Hadir',a.H],['Sakit',a.S],['Izin',a.I],['Alpa',a.A]].map(x=>`<div class="item"><span>${x[0]}</span><b>${x[1]} hari</b></div>`).join('')}<h3 style="margin-top:1rem">Pengumuman</h3>${news()}</div></div>`},

function applyTheme(){const d=new Date(),i=Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)%7,[n,h,p]=THEMES[i],a=(h+170)%360,h2=(h+35)%360;S.theme=n;
const w='rgba(255,255,255,.14)',P=['radial-gradient('+w+' 2px,transparent 2.5px) 0 0/26px 26px','repeating-linear-gradient(135deg,'+w+' 0 2px,transparent 2px 22px)','linear-gradient('+w+' 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,'+w+' 1px,transparent 1px) 0 0/32px 32px','repeating-radial-gradient(circle at 85% 15%,'+w+' 0 2px,transparent 2px 28px)','radial-gradient(circle at 20% 80%,'+w+' 0 90px,transparent 91px),radial-gradient(circle at 80% 20%,'+w+' 0 60px,transparent 61px)','repeating-linear-gradient(45deg,'+w+' 0 10px,transparent 10px 20px)','conic-gradient(from 200deg at 90% 90%,'+w+',transparent 25%,'+w+' 50%,transparent 75%)'][p];
const st=document.getElementById('th')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'th'}));
st.textContent=`:root{--bg:hsl(${h} 22% 96%);--so:hsl(${h} 30% 90%);--br:hsl(${h} 62% 28%);--bi:#fff;--ac:hsl(${a} 90% 58%);--ai:hsl(${a} 80% 12%);--ln:hsl(${h} 20% 86%);--ink:hsl(${h} 40% 12%);--mu:hsl(${h} 12% 38%);--h1:hsl(${h} 62% 28%);--h2:hsl(${h2} 60% 18%)}@media(prefers-color-scheme:dark){:root{--bg:hsl(${h} 30% 8%);--sf:hsl(${h} 25% 12%);--so:hsl(${h} 25% 18%);--br:hsl(${h} 60% 64%);--bi:hsl(${h} 60% 8%);--ink:hsl(${h} 30% 92%);--mu:hsl(${h} 15% 68%);--ln:hsl(${h} 20% 22%);--h1:hsl(${h} 55% 58%);--h2:hsl(${h2} 55% 52%)}}.hero{background:${P},linear-gradient(150deg,var(--h1),var(--h2))}.three{display:flex;gap:.6rem;flex-wrap:wrap}.three span{border:1.5px solid currentColor;border-radius:99px;padding:.25rem .8rem;font-size:.9rem}`}
function schoolHooks(){call('infoPublik').then(x=>{const c=$('#cnt');if(c&&x.sekolah>0){c.textContent=x.sekolah.toLocaleString('id-ID')+' sekolah dan kampus';c.hidden=false}}).catch(()=>{});
const sk=$('#sk');if(!sk)return;let t;const go=()=>{const q=sk.value.trim();if(q.length<3)return;call('cariSekolah',q,$('#jj').value).then(r=>{$('#skl').innerHTML=r.map(s=>`<option value="${esc(s.nama)}" label="${esc([s.kab,s.prov].filter(Boolean).join(', ')+(s.npsn?' - NPSN '+s.npsn:''))}">`).join('');$('#skh').textContent=r.length?r.length+' hasil. Pilih dari daftar, atau tulis nama sendiri.':'Belum ada di direktori. Nama yang Anda tulis akan ditambahkan.'}).catch(()=>{})};sk.oninput=()=>{clearTimeout(t);t=setTimeout(go,350)};$('#jj').onchange=go}
applyTheme();
authView();
</script></body></html>
